<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f12"/>
      <stop offset="1" stop-color="#16191f"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6f24e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#c6f24e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 225H1600M0 450H1600M0 675H1600M400 0V900M800 0V900M1200 0V900"/>
  </g>
  <!-- minimum balance line -->
  <line x1="120" y1="640" x2="1480" y2="640" stroke="#ff6b6b" stroke-width="4" stroke-dasharray="18 14" opacity="0.8"/>
  <text x="1480" y="620" fill="#ff6b6b" font-family="monospace" font-size="30" text-anchor="end" opacity="0.9">minimum balance</text>
  <!-- balance forecast: payday spikes, bills dips -->
  <path d="M120 360 L300 430 L420 520 L520 560 L560 300 L740 400 L880 500 L980 545 L1020 280 L1200 380 L1340 470 L1480 520 L1480 900 L120 900 Z" fill="url(#area)"/>
  <path d="M120 360 L300 430 L420 520 L520 560 L560 300 L740 400 L880 500 L980 545 L1020 280 L1200 380 L1340 470 L1480 520" fill="none" stroke="#c6f24e" stroke-width="8" stroke-linejoin="round"/>
  <!-- earliest safe date marker -->
  <circle cx="560" cy="300" r="18" fill="#c6f24e"/>
  <circle cx="560" cy="300" r="38" fill="none" stroke="#c6f24e" stroke-width="4" opacity="0.5"/>
  <text x="600" y="250" fill="#e4e4e7" font-family="monospace" font-size="32">payday: safe to buy</text>
  <!-- title -->
  <text x="120" y="805" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104">Buy or Wait?</text>
  <text x="1480" y="110" fill="#a1a1aa" font-family="monospace" font-size="34" text-anchor="end">90-day balance forecast</text>
</svg>
